[project]
name = "guidegen-engine"
version = "0.1.0"
description = "Mechanics engine for the GuideGen agent skill: drives apps, captures, redacts, annotates and renders user manuals."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
    "typer>=0.12",
    "pydantic>=2.7",
    "ruamel.yaml>=0.18",
    "jinja2>=3.1",
    "pillow>=10.4",
    "python-docx>=1.1",
    "playwright>=1.49",
    "pywinauto>=0.6.8; sys_platform == 'win32'",
    "pypdf>=4.0",
]

[project.scripts]
guidegen = "guidegen_engine.cli:main"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.12"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/guidegen_engine"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "e2e: needs a running example app and browsers (deselect with -m 'not e2e')",
    "windows: needs Windows desktop",
]
addopts = "-m 'not e2e'"

[tool.ruff]
target-version = "py311"  # the lowest supported Python: catches syntax that only newer versions accept
line-length = 140
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "B", "UP", "SIM"]
ignore = [
    "E501",    # long lines are allowed; the formatter is not enforced yet
    "E741",    # short names like l/t/r/b for rect edges are clearer here
    "B008",    # typer.Option(...) defaults are the idiomatic typer style
    "SIM105",  # try/except/pass reads fine for best-effort cleanup
]
