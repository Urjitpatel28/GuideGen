gettingStarted:
  requirements: "- A Windows 10 or Windows 11 PC with Stockroom Inventory installed.\n- The user name and password your administrator gave you.\n"
  launch: Open the **Start** menu and click **Stockroom Inventory**. The **Sign in** window appears.
  signIn: Type your **User name** and **Password**, then click **Sign in**.
  tour: The main window has three tabs. **Items** lists everything in stock, **Suppliers** lists who you buy from and **Reports** sums up your stock. Use the **File**, **Items** and **Help** menus at the top for everything else.
  tourScreen: items
