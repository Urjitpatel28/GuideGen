meta:
  title: Stockroom Inventory User Manual
  audience: end users
  intro: Stockroom Inventory keeps track of what is on your shelves - items, quantities, prices and suppliers. This manual walks you through everyday jobs and explains every window.
  generatedAt: 2026-09-24 16:03:18+00:00
