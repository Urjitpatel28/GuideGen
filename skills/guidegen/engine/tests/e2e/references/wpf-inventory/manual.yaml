troubleshooting:
  - message: Invalid user name or password.
    source: src/Inventory/ViewModels/Validation.cs
    cause: The user name or password is wrong.
    fix: Check both and that **Caps Lock** is off. Ask your administrator to reset your password if needed.
  - message: SKU is required.
    source: src/Inventory/ViewModels/Validation.cs
    cause: The **SKU** box is empty.
    fix: Type a stock code, for example **HW-1003**.
  - message: Another item already uses this SKU.
    source: src/Inventory/ViewModels/Validation.cs
    cause: SKUs must be unique.
    fix: Use a different SKU, or edit the existing item instead.
  - message: Name is required.
    source: src/Inventory/ViewModels/Validation.cs
    cause: The name box is empty.
    fix: Type a name.
  - message: Quantity cannot be negative.
    source: src/Inventory/ViewModels/Validation.cs
    cause: The quantity is below zero.
    fix: Type **0** or more.
  - message: Quantity must be a whole number.
    source: src/Inventory/ViewModels/Validation.cs
    cause: The quantity has letters or decimals.
    fix: Type a whole number such as **12**.
  - message: Unit price must be greater than 0.
    source: src/Inventory/ViewModels/Validation.cs
    cause: The price is empty or zero.
    fix: Type a price such as **4.50**.
  - message: Select an item in the list first.
    source: src/Inventory/ViewModels/Validation.cs
    cause: You clicked **Edit**, **Receive stock** or **Delete** without choosing an item.
    fix: Click an item in the list first.
  - message: That category already exists.
    source: src/Inventory/ViewModels/Validation.cs
    cause: A category with the same name is already in the list.
    fix: Choose a different name.
  - message: Low-stock threshold must be between 0 and 1000.
    source: src/Inventory/ViewModels/Validation.cs
    cause: The number is outside the allowed range.
    fix: Type a whole number from **0** to **1000**.
