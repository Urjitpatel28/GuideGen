troubleshooting:
  - message: The user name or password is incorrect.
    source: src/Crm/Data.cs
    cause: The sign-in details do not match an account.
    fix: Check both and that **Caps Lock** is off.
  - message: Enter the customer's name.
    source: src/Crm/Data.cs
    cause: The **Name** box is empty.
    fix: Type the contact's name.
  - message: Enter a valid email address.
    source: src/Crm/Data.cs
    cause: The email address is incomplete.
    fix: Type a full address such as **name@company.com**.
  - message: A customer with this email address already exists.
    source: src/Crm/Data.cs
    cause: Two customers cannot share an email address.
    fix: Search for the existing customer and edit them instead.
  - message: Annual value must be a number of 0 or more.
    source: src/Crm/Data.cs
    cause: The value has letters or is negative.
    fix: Type a number such as **15000**, without currency symbols.
  - message: Select a customer first.
    source: src/Crm/Data.cs
    cause: You clicked **Edit** or **Delete** without choosing a customer.
    fix: Click a customer in the list first.
  - message: Choose a customer for this activity.
    source: src/Crm/Data.cs
    cause: No customer was chosen in **Customer**.
    fix: Choose who the activity was with.
  - message: Notes cannot be longer than 500 characters.
    source: src/Crm/Data.cs
    cause: The notes are too long.
    fix: Shorten the notes or split them into two activities.
