gettingStarted:
  requirements: "- A Windows 10 or Windows 11 PC with ClientDesk installed.\n- Your ClientDesk user name and password.\n"
  launch: Open the **Start** menu and click **ClientDesk**. The **Sign in to ClientDesk** window appears.
  signIn: Type your **User name** and **Password**, then click **Sign in**.
  tour: The main window has three tabs. **Customers** lists your contacts, **Activities** shows your calls, emails and meetings, and **Dashboard** shows your pipeline. The **File**, **Customers** and **Help** menus are at the top.
  tourScreen: customers
