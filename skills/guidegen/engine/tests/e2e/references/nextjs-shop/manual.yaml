troubleshooting:
  - message: Invalid email or password
    source: lib/validate.js
    cause: The email or password does not match your account.
    fix: Check for typing mistakes and that **Caps Lock** is off, then try again. Ask your administrator if you have forgotten your password.
  - message: Price must be greater than 0
    source: lib/validate.js
    cause: The **Price** box is empty, 0 or not a number.
    fix: Type a price such as **9.99**.
  - message: Stock cannot be negative
    source: lib/validate.js
    cause: The stock count is below zero or not a number.
    fix: Type **0** or a positive whole number.
  - message: Select a customer
    source: lib/validate.js
    cause: No customer was chosen in **Customer**.
    fix: Choose a customer. If they are not in the list, add them on the **Customers** page first.
  - message: Quantity must be greater than 0
    source: lib/validate.js
    cause: The **Quantity** is 0, empty or not a number.
    fix: Type **1** or more.
  - message: Not enough stock for this quantity
    source: lib/validate.js
    cause: You asked for more items than are in stock.
    fix: Lower the quantity, or correct the stock count on the product's page first.
  - message: Email is not valid
    source: lib/validate.js
    cause: The email address is missing a part such as @ or the domain.
    fix: Type a full address, for example **name@company.com**.
  - message: Low-stock threshold must be between 0 and 1000
    source: lib/validate.js
    cause: The number is outside the allowed range.
    fix: Type a whole number from **0** to **1000**.
