gettingStarted:
  requirements: "- A computer with an up-to-date web browser (Microsoft Edge, Google Chrome, Firefox or Safari).\n- The Acme Shop web address and the email and password your administrator gave you.\n"
  launch: Open your web browser and go to the Acme Shop address. The **Sign in to Acme Shop** page appears.
  signIn: Type your **Email** and **Password**, then click **Sign in**. If you see *Invalid email or password*, check both and try again.
  tour: "After you sign in you see the **Dashboard**. The menu on the left takes you to **Products**, **Orders**, **Customers** and **Settings**. Click **Sign out** at the bottom of the menu when you are finished.\n"
  tourScreen: dashboard
